<!-- 404 V1: OPULENT — Dark luxury 404 with navigation -->

<!-- wp:group {"tagName":"main","style":{"color":{"background":"#0A1628"},"spacing":{"padding":{"top":"0","bottom":"0"}}},"layout":{"type":"default"}} -->
<main class="wp-block-group" style="background:#0A1628;min-height:80vh;display:flex;align-items:center">

  <div style="max-width:1200px;margin:0 auto;padding:6rem 2rem;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6rem;align-items:center">

    <!-- Left: Error message -->
    <div>
      <p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.25em;color:#C9A84C;margin-bottom:1.5rem">Error 404</p>
      <h1 style="font-family:var(--wp--preset--font-family--playfair);font-size:clamp(4rem,8vw,7rem);font-weight:700;color:#FFFFFF;line-height:0.9;letter-spacing:-0.03em;margin:0 0 2rem">Page<br>Not<br>Found</h1>
      <p style="font-size:1rem;color:rgba(255,255,255,0.5);line-height:1.8;margin-bottom:2.5rem;max-width:420px">The property or page you're looking for may have been sold, moved, or no longer exists. Let us help you find what you need.</p>
      <div style="display:flex;gap:1rem;flex-wrap:wrap">
        <a href="/" style="background:#C9A84C;color:#0A1628;padding:1rem 2.5rem;font-size:0.82rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;text-decoration:none;border-radius:4px">Return Home</a>
        <a href="/properties" style="background:transparent;color:#C9A84C;padding:1rem 2.5rem;font-size:0.82rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;text-decoration:none;border:1px solid rgba(201,168,76,0.3);border-radius:4px">Browse Properties</a>
      </div>
    </div>

    <!-- Right: Search + quick links -->
    <div>
      <div style="background:#112240;border:1px solid rgba(201,168,76,0.08);border-radius:12px;padding:2.5rem;margin-bottom:2rem">
        <p style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:#C9A84C;margin-bottom:1.25rem">Search Our Listings</p>
        <div style="display:flex;gap:0.75rem">
          <input type="text" placeholder="Neighborhood, address, or ZIP..." style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:0.875rem 1rem;color:#FFFFFF;font-size:0.9rem;outline:none" />
          <button style="background:#C9A84C;color:#0A1628;border:none;padding:0.875rem 1.5rem;border-radius:6px;font-size:0.82rem;font-weight:700;cursor:pointer">Go</button>
        </div>
      </div>

      <div style="background:#112240;border:1px solid rgba(201,168,76,0.08);border-radius:12px;padding:2.5rem">
        <p style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:#C9A84C;margin-bottom:1.25rem">Popular Pages</p>
        <div style="display:flex;flex-direction:column;gap:0">
          <a href="/properties" style="text-decoration:none;padding:0.875rem 0;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:0.88rem;color:#FFFFFF">Properties for Sale</span>
            <span style="color:#C9A84C;font-size:0.82rem">→</span>
          </a>
          <a href="/neighborhoods" style="text-decoration:none;padding:0.875rem 0;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:0.88rem;color:#FFFFFF">Neighborhoods</span>
            <span style="color:#C9A84C;font-size:0.82rem">→</span>
          </a>
          <a href="/agents" style="text-decoration:none;padding:0.875rem 0;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:0.88rem;color:#FFFFFF">Our Agents</span>
            <span style="color:#C9A84C;font-size:0.82rem">→</span>
          </a>
          <a href="/contact" style="text-decoration:none;padding:0.875rem 0;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:0.88rem;color:#FFFFFF">Contact Us</span>
            <span style="color:#C9A84C;font-size:0.82rem">→</span>
          </a>
        </div>
      </div>
    </div>

  </div>

</main>
